<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Нет соединения — Z.ai</title>
  <link rel="icon" href="/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #17171a; color: #ededf0; padding: 24px;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
      text-align: center;
    }
    .card { max-width: 420px; }
    .icon {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px;
      background: #101013;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    .icon svg { width: 38px; height: 38px; }
    h1 { font-size: 22px; margin-bottom: 10px; }
    p { color: #9b9ba1; line-height: 1.55; font-size: 15px; margin-bottom: 24px; }
    button {
      min-height: 48px; padding: 0 28px; border: 0; border-radius: 14px; cursor: pointer;
      font-size: 15px; font-weight: 600; color: #17171a;
      background: #ededf0;
    }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" rx="112" fill="#FFFFFF"/><g fill="#101013"><rect x="136" y="136" width="240" height="62" rx="12"/><rect x="136" y="314" width="240" height="62" rx="12"/><path d="M282 136 H376 L230 376 H136 Z"/></g></svg>
    </div>
    <h1>Нет интернет-соединения</h1>
    <p>Z.ai открыт, но для ответов ИИ нужен интернет. Проверьте подключение и попробуйте снова — история чатов сохранена на устройстве.</p>
    <button onclick="location.reload()">Повторить подключение</button>
  </div>
</body>
</html>
